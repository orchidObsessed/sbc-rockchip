name: orangepi-5-pro
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - env:
      GOPATH: /tmp/go
    network: default
    cachePaths:
      - /.cache/go-build
      - /tmp/go/pkg
    prepare:
      - |
        cd /pkg/src
        go mod download
  - env:
      GOPATH: /tmp/go
    cachePaths:
      - /.cache/go-build
      - /tmp/go/pkg
    build:
      - |
        cd /pkg/src
        CGO_ENABLED=0 go build -o ./orangepi-5-pro .
    install:
      - |
        mkdir -p /rootfs/installers/
        cp -p /pkg/src/orangepi-5-pro /rootfs/installers/orangepi-5-pro

        mkdir -p /rootfs/boot/dtb/rockchip/
        cp -p artifacts/orangepi-5-pro/dtb/rk3588s-orangepi-5-pro.dtb /rootfs/boot/dtb/rockchip/rk3588s-orangepi-5-pro.dtb
finalize:
  - from: /rootfs
    to: /rootfs
